<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ingreso | Taller360</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Fondo oscuro */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            color: #00d26a; /* Verde estilo Kik */
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #aaaaaa;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #00d26a;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #00d26a;
            color: #121212;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #00b058;
        }
        .error-msg {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">SISTEMA TALLER</div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="ejemplo@taller.com">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            
            <button type="submit">Ingresar al Sistema</button>
            <div id="error-message" class="error-msg"></div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita que la página recargue
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            
            try {
                // Enviamos los datos al backend de Python
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // ¡Login exitoso! Guardamos la llave y entramos
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('taller_id', data.taller_id);
                    window.location.href = '/'; // Redirige al panel principal (index.html)
                } else {
                    // Muestra el error de Python (Ej: Contraseña incorrecta)
                    errorDiv.innerText = data.detail;
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.innerText = "Error de conexión con el servidor.";
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
